name: CI

# En cada push y PR: tipos, lint, tests unitarios y build. La integración (base real de Neon,
# branch `test`) corre solo en los PR a main. Con CI en rojo no se mergea (protección de main).
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Tipos, lint, tests y build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Valores ficticios: el build no se conecta a nada, pero el cliente de Prisma exige la URL.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
      AUTH_SECRET: ci-solo-para-compilar
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit -p .
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm seed:check
      - run: pnpm flujos:check
      - run: pnpm build

  integracion:
    name: Integración (base de test)
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    needs: verificar
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: integracion-neon-test
      cancel-in-progress: false
    env:
      DATABASE_URL_TEST: ${{ secrets.DATABASE_URL_TEST }}
      DIRECT_URL_TEST: ${{ secrets.DIRECT_URL_TEST }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integracion
